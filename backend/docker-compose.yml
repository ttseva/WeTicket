services:
  postgres:
    image: postgres:16-alpine
    container_name: weticket-postgres
    environment:
      POSTGRES_DB: weticket_dev
      POSTGRES_USER: weticket
      POSTGRES_PASSWORD: weticket
    ports:
      - "5433:5432"
    volumes:
      - weticket_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weticket -d weticket_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  weticket_pgdata:
