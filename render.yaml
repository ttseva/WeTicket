services:
  - type: web
    name: weticket-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run db:generate
    startCommand: npx prisma migrate deploy && npm run db:seed && npm run start
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        sync: false 
      - key: DIRECT_URL
        sync: false 
      - key: JWT_ACCESS_SECRET
        generateValue: true 
      - key: JWT_REFRESH_SECRET
        generateValue: true 
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d

  - type: web
    name: weticket-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html 