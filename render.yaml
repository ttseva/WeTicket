services:
  - type: web
    name: weticket-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run db:generate
    startCommand: npx prisma migrate deploy && npm run db:seed && npm run start
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        sync: false 
      - key: DIRECT_URL
        sync: false 
      - key: JWT_ACCESS_SECRET
        generateValue: true 
      - key: JWT_REFRESH_SECRET
        generateValue: true 
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: PRISMA_SCHEMA_DISABLE_ADVISORY_LOCK
        value: "1"
      - key: EXPIRATION_JOB_ENABLED
        value: "true"
      - key: EXPIRATION_JOB_INTERVAL_MS
        value: "60000"

  - type: web
    name: weticket-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://weticket-backend.onrender.com/v1
    routes:
      - type: rewrite
        source: "/*"
        destination: /index.html 